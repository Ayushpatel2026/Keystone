name: Build LaTeX and Deploy PDFs

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_build: ${{ steps.filter.outputs.run_build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if LaTeX/Doc files changed
        id: filter
        run: |
          # Compare against the same range GitHub's old `paths:` filter used:
          # the whole push (before..after) or the whole PR (base..head).
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "run_build=true" >> $GITHUB_OUTPUT
              exit 0
              ;;
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              ;;
            *)
              BASE="${{ github.event.before }}"
              ;;
          esac

          # New branch (all-zero SHA) or empty: fall back to the previous commit
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD^
          fi

          # Force-push can leave BASE missing from history: build to be safe
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "BASE $BASE not found in history; building to be safe"
            echo "run_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BASE" HEAD | grep -qE '^(docs/|refs/|Makefile$|\.github/scripts/|\.github/workflows/latex-pages\.yml$)'; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "No documentation changes detected. Skipping LaTeX build."
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

  build-latex:
    needs: changes
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Restore PDF cache
        uses: actions/cache@v5
        with:
          path: build-pdf
          key: pdf-cache-${{ github.run_id }}
          restore-keys: |
            pdf-cache-

      - name: Seed PDF cache from committed PDFs
        run: |
          # The committed pdfs/ directory is the source of truth, not the
          # Actions cache. A cache miss (eviction, 7-day expiry, size limit)
          # must never let the later rsync --delete wipe committed PDFs.
          mkdir -p build-pdf
          if [ -d pdfs ]; then
            rsync -av --ignore-existing pdfs/ build-pdf/
          fi

      - name: Get changed LaTeX files
        id: latex-files
        run: |
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            *)            BASE="${{ github.event.before }}" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD^
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=HEAD^
          fi

          # Every file under docs/ and refs/ is a candidate, not just .tex and
          # .md: a change to a shared \input, a figure or the bibliography has
          # to rebuild the documents that read it. Which documents those are is
          # decided by select_docs.py from the recorded dependency graph, so no
          # filtering by extension happens here.
          SCOPE=(':(glob)docs/**' ':(glob)refs/**' 'Makefile'
                 ':(glob).github/workflows/latex-pages.yml'
                 ':(glob).github/scripts/**')

          CHANGED_FILES=$(git diff --name-only --diff-filter=d "$BASE" "${{ github.sha }}" -- "${SCOPE[@]}" | xargs)
          DELETED_FILES=$(git diff --name-only --diff-filter=D "$BASE" "${{ github.sha }}" -- "${SCOPE[@]}" | xargs)

          echo "Changed files: $CHANGED_FILES"
          echo "Deleted files: $DELETED_FILES"
          echo "DELETED_FILES=$DELETED_FILES" >> $GITHUB_ENV

          BUILD_DOCS=$(python3 .github/scripts/select_docs.py \
                         --changed $CHANGED_FILES \
                         --deleted $DELETED_FILES \
                         --manifest .pdf-deps.json --root . | xargs)

          echo "Documents to build: $BUILD_DOCS"
          echo "BUILD_DOCS=$BUILD_DOCS" >> $GITHUB_ENV

          CHANGED_FILENAMES=$(for file in $BUILD_DOCS; do basename "$file"; done | xargs)
          echo "CHANGED_FILENAMES=$CHANGED_FILENAMES" >> $GITHUB_ENV

          FILE_COUNT=$(echo "$CHANGED_FILENAMES" | wc -w)
          if [ "$FILE_COUNT" -gt 1 ]; then
            PLURAL_S='s'
          else
            PLURAL_S=''
          fi
          echo "PLURAL_S=$PLURAL_S" >> $GITHUB_ENV

      # Installing these with apt takes ~126s, almost all of it unpacking
      # rather than downloading, so caching the installed files (not the
      # .debs) is what saves time. Pinned to a commit: this template is
      # forked widely and the job has contents: write.
      # texlive-full is avoided deliberately; it is far larger than needed.
      # pandoc drives the Markdown -> PDF rule in the Makefile.
      # graphviz renders the .dot diagrams (e.g. the MG uses hierarchy).
      - name: Install TeX Live, pandoc and Graphviz
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: texlive-latex-extra texlive-science texlive-fonts-extra texlive-fonts-recommended texlive-latex-recommended lmodern pandoc graphviz
          version: 1.2

      - name: Verify the TeX toolchain is usable
        run: |
          # A restored cache that skipped texlive's postinst would leave
          # pdflatex unable to find packages. Fail here, loudly, rather than
          # part way through compiling documents.
          # Restoring cached package files skips their postinst scripts, and
          # texlive's is what builds the ls-R filename database. Without this
          # kpsewhich cannot see the restored packages, which surfaced as
          # "lmodern.sty not found" on the first cache hit.
          sudo mktexlsr
          # ...and updmap-sys is what builds the font map files. Without it
          # pdflatex finds lmodern.sty but not the fonts it maps to, failing
          # with "Font rm-lmr7 at 600 not found".
          sudo updmap-sys >/dev/null

          if ! command -v bibtex >/dev/null; then
            sudo update-alternatives --install /usr/bin/bibtex bibtex /usr/bin/bibtex.original 100
          fi
          bibtex --version | head -1

          pdflatex --version | head -1
          pandoc --version | head -1
          dot -V
          command -v acyclic
          kpsewhich article.cls
          kpsewhich amsmath.sty
          # pandoc's default template pulls in packages the .tex documents
          # never ask for (lmodern.sty was missing the first time this ran),
          # so smoke-test the Markdown path itself rather than guessing at
          # the package list.
          smoke=$(mktemp -d)
          printf '%s\n' '# Smoke test' '' 'Math $x^2$ and a table:' '' \
            '| a | b |' '|---|---|' '| 1 | 2 |' > "$smoke/smoke.md"
          pandoc "$smoke/smoke.md" -o "$smoke/smoke.pdf" \
            --pdf-engine=pdflatex --toc -V geometry:margin=1in
          test -s "$smoke/smoke.pdf" && echo "pandoc -> PDF smoke test OK"
          rm -rf "$smoke"

      - name: Compile LaTeX
        run: |
          PDF_CACHE_DIR="$GITHUB_WORKSPACE/build-pdf"
          mkdir -p "$PDF_CACHE_DIR"

          echo "Documents selected for build: $BUILD_DOCS"

          for src in $BUILD_DOCS; do
            pdf="${src%.*}.pdf"

            # Build using existing Makefile rules
            make -B "$pdf"

            # Record what this document actually read, for the next run's
            # change detection. Runs after the build so the .fls is present.
            python3 .github/scripts/record_deps.py "$src" .pdf-deps.json .

            # Copy result into build-pdf, preserving structure below docs/
            rel=$(dirname "$pdf"); rel="${rel#docs}"; rel="${rel#/}"
            mkdir -p "$PDF_CACHE_DIR/$rel"
            cp "$pdf" "$PDF_CACHE_DIR/$rel/"
          done

          # Remove cached PDFs that no longer have a source document. This is
          # driven by the filesystem rather than by this push's diff: a run
          # that fails before this point would otherwise lose the deletion for
          # good, because the next push's diff no longer mentions it.
          find "$PDF_CACHE_DIR" -name '*.pdf' -print | while read -r cached; do
            rel="${cached#$PDF_CACHE_DIR/}"
            stem="docs/${rel%.pdf}"
            if [ ! -f "$stem.tex" ] && [ ! -f "$stem.md" ]; then
              echo "Removing $rel: no source document builds it any more"
              rm -f "$cached"
            fi
          done

          # Drop manifest entries for documents that no longer exist
          python3 .github/scripts/record_deps.py --prune .pdf-deps.json .
        #continue-on-error: true # Job continues even if this step fails

      - name: Sync PDFs for TA review
        run: |
          rm -rf pdfs
          mkdir -p pdfs
          rsync -av --delete build-pdf/ pdfs/

      - name: Commit PDFs to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "keystone-pipeline-bot[bot]"
          git config user.email "keystone-pipeline-bot[bot]@users.noreply.github.com"
          git add pdfs .pdf-deps.json
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Update generated PDFs for review"
            # Another docs push may have landed while we were compiling.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Pushed PDFs on attempt $attempt"
                exit 0
              fi
              echo "Push rejected; rebasing onto latest main (attempt $attempt)"
              git pull --rebase origin main
            done
            echo "Could not push PDFs after 3 attempts"
            exit 1
          fi

      - name: Prepare site
        run: |
          set -euo pipefail

          # Recreate public directory
          rm -rf public
          mkdir -p public

          # Copy PDFs preserving structure
          rsync -av build-pdf/ public/

          # Build the index. This runs after the PDFs are committed, so the
          # per-document timestamps come from that commit.
          python3 .github/scripts/build_index.py \
            --public public \
            --template site/index.html \
            --output public/index.html \
            --tracked-dir pdfs

          # Copy static assets
          cp site/style.css public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # This is the job to mark as required in branch protection. It always runs,
  # so the required check is never left "pending", and it fails if the filter
  # or the build failed. A plain skipped job would also count as passing when
  # `changes` itself broke, which would let a broken PR through.
  build-pdfs:
    needs: [changes, build-latex]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_BUILD: ${{ needs.changes.outputs.run_build }}
          BUILD_RESULT: ${{ needs.build-latex.result }}
        run: |
          echo "changes=$CHANGES_RESULT run_build=$RUN_BUILD build-latex=$BUILD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed"
            exit 1
          fi
          if [ "$RUN_BUILD" = "true" ]; then
            [ "$BUILD_RESULT" = "success" ] || { echo "LaTeX build did not succeed"; exit 1; }
          else
            echo "No documentation changes; nothing to build."
          fi

  deploy:
    needs: build-latex
    # Only the real branch publishes. A pull request, especially one from a
    # fork, has a read-only token and cannot deploy, so without this the
    # deploy job fails on every pull request. If the build job was skipped
    # (no doc changes), this job is skipped too and the live site stays as is.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5