name: Python CI

# No `paths:` filter here on purpose. If the whole workflow is skipped by a
# paths filter, its required checks stay "pending" and block the merge.
# Instead the workflow always starts, and the `changes` job decides whether
# the real work runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if src changed
        id: filter
        run: |
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            *)            BASE="${{ github.event.before }}" ;;
          esac

          # New branch (all-zero SHA) or empty: fall back to the previous commit
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD^
          fi

          # Force-push can leave BASE missing from history: run to be safe
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "BASE $BASE not found in history; running CI to be safe"
            echo "run_ci=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BASE" HEAD | grep -qE '^(src/|\.github/workflows/ci\.yml$)'; then
            echo "run_ci=true" >> $GITHUB_OUTPUT
          else
            echo "No backend changes detected. Skipping CI."
            echo "run_ci=false" >> $GITHUB_OUTPUT
          fi

  backend-ci-run:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff (Lint)
        run: uv run ruff check .

      - name: Run Ruff (Format check)
        run: uv run ruff format --check .

      - name: Run Mypy (Type check)
        run: uv run mypy

      - name: Run Pytest
        run: uv run pytest

  # Mark THIS job as required in branch protection. It always runs, passes
  # when src didn't change, and fails if detection or the real CI failed.
  backend-ci:
    needs: [changes, backend-ci-run]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          CI_RESULT: ${{ needs.backend-ci-run.result }}
        run: |
          echo "changes=$CHANGES_RESULT run_ci=$RUN_CI backend-ci-run=$CI_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed"
            exit 1
          fi
          if [ "$RUN_CI" = "true" ]; then
            [ "$CI_RESULT" = "success" ] || { echo "Backend CI did not succeed"; exit 1; }
          else
            echo "No backend changes; nothing to check."
          fi