name: Frontend CI

# Same pattern as backend-ci.yml: no `paths:` filter, so the required check
# never sits "pending". The `changes` job decides whether the real work runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if src/frontend changed
        id: filter
        run: |
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            *)            BASE="${{ github.event.before }}" ;;
          esac

          # New branch (all-zero SHA) or empty: fall back to the previous commit
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD^
          fi

          # Force-push can leave BASE missing from history: run to be safe
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "BASE $BASE not found in history; running CI to be safe"
            echo "run_ci=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BASE" HEAD | grep -qE '^(src/frontend/|src/backend/(app/|pyproject\.toml$|uv\.lock$)|\.github/workflows/frontend-ci\.yml$)'; then
            echo "run_ci=true" >> $GITHUB_OUTPUT
          else
            echo "No frontend changes detected. Skipping CI."
            echo "run_ci=false" >> $GITHUB_OUTPUT
          fi

  frontend-ci-run:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The API types aren't committed; they're generated from the backend here,
      # so lint, type check and tests always run against the current API.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: src/backend/.python-version

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --frozen --no-dev

      - name: Generate API types
        run: npm run gen:api

      # Fails only on high or critical advisories, so minor ones in dev tools
      # don't block merges. Run `npm audit` locally to see everything.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      # `build` runs `tsc -b` first, so this is also the type check.
      - name: Type check and build
        run: npm run build

      # Writes coverage/lcov.info for SonarQube to import.
      - name: Run tests with coverage
        run: npm run coverage

  # Mark THIS job as required in branch protection. It always runs, passes
  # when src/frontend didn't change, and fails if detection or the real CI failed.
  frontend-ci:
    needs: [changes, frontend-ci-run]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          CI_RESULT: ${{ needs.frontend-ci-run.result }}
        run: |
          echo "changes=$CHANGES_RESULT run_ci=$RUN_CI frontend-ci-run=$CI_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed"
            exit 1
          fi
          if [ "$RUN_CI" = "true" ]; then
            [ "$CI_RESULT" = "success" ] || { echo "Frontend CI did not succeed"; exit 1; }
          else
            echo "No frontend changes; nothing to check."
          fi
